<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Butterflies in the wallet</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="/src/main.js"></script>
</head>
<body>

<div id="app" class="app">

  <header class="topbar">
    <div class="topbar-riga">
      <div class="mese-nav">
        <button id="mesePrev" class="icon-btn" aria-label="Mese precedente"><svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M6.5 1L1.5 6.5L6.5 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <button id="meseLabel" class="mese-label" title="Torna al mese corrente">—</button>
        <button id="meseNext" class="icon-btn" aria-label="Mese successivo"><svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1.5 1L6.5 6.5L1.5 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>
      <div class="topbar-dx">
        <button id="statoSalva" class="stato-salva" data-stato="file"><i></i><span>—</span></button>
      </div>
    </div>
  </header>

  <main id="scroll" class="contenuto"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="casa">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M12 3.2 2.8 11a1 1 0 0 0 1.3 1.5l.9-.7V19a1.8 1.8 0 0 0 1.8 1.8H10v-5.3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5.3h3.2A1.8 1.8 0 0 0 19 19v-7.2l.9.7a1 1 0 0 0 1.3-1.5L12 3.2Z" fill="currentColor"/></svg>
      <span>Casa</span>
    </button>
    <button class="tab" data-tab="storico">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="6" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="5" cy="18" r="1.6" fill="currentColor"/><path d="M9.5 6H20M9.5 12H20M9.5 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Storico</span>
    </button>
    <div class="tabbar-spazio"></div>
    <button class="tab" data-tab="stats">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="12" width="4.5" height="8.5" rx="1.3" fill="currentColor"/><rect x="9.75" y="4" width="4.5" height="16.5" rx="1.3" fill="currentColor"/><rect x="16" y="8.5" width="4.5" height="12" rx="1.3" fill="currentColor"/></svg>
      <span>Statistiche</span>
    </button>
    <button class="tab" data-tab="impostazioni">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="2.6" stroke-dasharray="3.22 3.22"/><circle cx="12" cy="12" r="5.1" stroke="currentColor" stroke-width="4.2"/></svg>
      <span>Impostazioni</span>
    </button>
  </nav>

  <button id="fab" class="fab" aria-label="Aggiungi movimento">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M12 5.5v13M5.5 12h13" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

</div>

<div id="sheets"></div>
<div id="toast" class="toast-host" hidden></div>

</body>
</html>
