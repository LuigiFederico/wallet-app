<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F7F3EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Butterflies in the wallet</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script type="module" src="/src/main.js"></script>
</head>
<body>

<div id="app" class="app">

  <header class="topbar">
    <div class="topbar-riga">
      <div class="mese-nav">
        <button id="mesePrev" class="icon-btn" aria-label="Mese precedente"><svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M6.5 1L1.5 6.5L6.5 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <div id="meseLabel" class="mese-label">—</div>
        <button id="meseNext" class="icon-btn" aria-label="Mese successivo"><svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1.5 1L6.5 6.5L1.5 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>
      <div class="topbar-dx">
        <button id="statoSalva" class="stato-salva" data-stato="file"><i></i><span>—</span></button>
        <svg class="logo" width="30" height="30" viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="116" height="116" rx="30" fill="#5B4BC4"/>
          <path d="M20 76a9 9 0 0 1 9-9h50a9 9 0 0 1 9 9v18a9 9 0 0 1-9 9H29a9 9 0 0 1-9-9z" fill="#F7F3EC"/>
          <path d="M20 76a9 9 0 0 1 9-9h21v10H20z" fill="#CFC6FB"/>
          <path d="M58 67h21a9 9 0 0 1 9 9H58z" fill="#CFC6FB"/>
          <circle cx="61" cy="59" r="3.4" fill="#F7F3EC" opacity=".55"/>
          <circle cx="70" cy="50" r="2.6" fill="#F7F3EC" opacity=".4"/>
          <g transform="translate(88 30) rotate(20) scale(.34) translate(-60 -60)">
            <path d="M58 40C44 14 16 14 12 34c-3.6 18 14 28 46 26z" fill="#F7F3EC"/>
            <path d="M62 40C76 14 104 14 108 34c3.6 18-14 28-46 26z" fill="#F7F3EC"/>
            <path d="M58 64C42 62 22 68 24 82c1.8 12.6 22 12 34-6z" fill="#E4DCFF"/>
            <path d="M62 64c16-2 36 4 34 18-1.8 12.6-22 12-34-6z" fill="#E4DCFF"/>
            <path d="M60 34c-1-8-6-12-12-14M60 34c1-8 6-12 12-14" stroke="#F7F3EC" stroke-width="5" stroke-linecap="round" fill="none"/>
            <rect x="56.4" y="32" width="7.2" height="56" rx="3.6" fill="#5B4BC4"/>
          </g>
        </svg>
      </div>
    </div>
  </header>

  <main id="scroll" class="contenuto"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="casa">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M3 10.2 11 3.4l8 6.8V19a.8.8 0 0 1-.8.8H3.8A.8.8 0 0 1 3 19v-8.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>Casa</span>
    </button>
    <button class="tab" data-tab="storico">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M4 6h14M4 11h14M4 16h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Storico</span>
    </button>
    <div class="tabbar-spazio"></div>
    <button class="tab" data-tab="stats">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M4 18V12M9.7 18V4M15.4 18v-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Statistiche</span>
    </button>
    <button class="tab" data-tab="impostazioni">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M11 3v2.2M11 16.8V19M3 11h2.2M16.8 11H19M5.3 5.3l1.6 1.6M15.1 15.1l1.6 1.6M16.7 5.3l-1.6 1.6M6.9 15.1l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Impostazioni</span>
    </button>
  </nav>

  <button id="fab" class="fab" aria-label="Aggiungi movimento">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M12 5.5v13M5.5 12h13" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

</div>

<div id="sheets"></div>
<div id="toast" class="toast-host" hidden></div>

</body>
</html>
