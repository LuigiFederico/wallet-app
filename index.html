<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F7F3EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Butterflies in the wallet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#F7F3EC;color:#16130F;font-family:"Manrope",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
input,select{font-family:inherit;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid #5B4BC4;outline-offset:-1px}
a{color:#5B4BC4;text-decoration:none}
a:hover{color:#3E30A0}
#scroll::-webkit-scrollbar,.chips::-webkit-scrollbar{width:0;height:0}
.num{font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:#fff;border:1px solid rgba(22,19,15,.09);border-radius:18px}
.lbl{font:600 10.5px/1 "Manrope";letter-spacing:.12em;text-transform:uppercase;color:#7C7367}
.h2{font:700 15px/1 "Manrope";letter-spacing:-.01em}
.sect{font:700 11px/1 "Manrope";letter-spacing:.14em;text-transform:uppercase;color:#7C7367}
.field{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(22,19,15,.12);background:#fff;font:600 15px/1.1 "Manrope";color:#16130F}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid rgba(22,19,15,.06);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 16px}
.chip{flex:none;white-space:nowrap;padding:10px 15px;border-radius:99px;font:700 12px/1 "Manrope";border:1px solid rgba(22,19,15,.12);background:#fff;color:#5C554B;min-height:36px}
.chip[data-on="1"]{background:#16130F;color:#F7F3EC;border-color:#16130F}
.bar{height:6px;border-radius:99px;background:rgba(22,19,15,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.sheet{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(22,19,15,.45);animation:fade .18s ease}
.panel{position:relative;background:#F7F3EC;border-radius:26px 26px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.22,.85,.3,1);max-height:92%;overflow:auto}
.grab{width:38px;height:4px;border-radius:99px;background:rgba(22,19,15,.18);margin:0 auto 14px}
.seg{display:flex;background:rgba(22,19,15,.06);border-radius:11px;padding:3px}
.seg>button{flex:1;padding:10px 0;border-radius:9px;font:700 13px/1 "Manrope";color:#7C7367;min-height:40px}
.seg>button[data-on="1"]{background:#fff;color:#16130F}
.cta{width:100%;padding:17px 0;border-radius:15px;text-align:center;font:800 14.5px/1 "Manrope";background:#16130F;color:#F7F3EC;min-height:52px}
.cta[disabled]{background:rgba(22,19,15,.10);color:#6F675C}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="app" style="height:100%;display:flex;flex-direction:column">

  <header style="flex:none;background:#F7F3EC;padding:calc(10px + env(safe-area-inset-top)) 20px 10px;z-index:5">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:2px">
        <button id="mesePrev" aria-label="Mese precedente" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#7C7367"><svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M6.5 1L1.5 6.5L6.5 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
        <div id="meseLabel" style="font:700 17px/1 'Manrope';min-width:130px;text-align:center;letter-spacing:-.01em">—</div>
        <button id="meseNext" aria-label="Mese successivo" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#7C7367"><svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1.5 1L6.5 6.5L1.5 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>
      <div style="display:flex;align-items:center;gap:9px">
        <button id="statoSalva" style="display:flex;align-items:center;gap:5px;font:600 10.5px/1 'Manrope';color:#6F675C;white-space:nowrap"><i style="width:5px;height:5px;border-radius:50%;background:#4E9C74;display:block"></i><span>—</span></button>
        <svg width="30" height="30" viewBox="0 0 120 120" fill="none" style="flex:none" aria-hidden="true">
          <rect x="2" y="2" width="116" height="116" rx="30" fill="#5B4BC4"/>
          <path d="M20 76a9 9 0 0 1 9-9h50a9 9 0 0 1 9 9v18a9 9 0 0 1-9 9H29a9 9 0 0 1-9-9z" fill="#F7F3EC"/>
          <path d="M20 76a9 9 0 0 1 9-9h21v10H20z" fill="#CFC6FB"/>
          <path d="M58 67h21a9 9 0 0 1 9 9H58z" fill="#CFC6FB"/>
          <circle cx="61" cy="59" r="3.4" fill="#F7F3EC" opacity=".55"/>
          <circle cx="70" cy="50" r="2.6" fill="#F7F3EC" opacity=".4"/>
          <g transform="translate(88 30) rotate(20) scale(.34) translate(-60 -60)">
            <path d="M58 40C44 14 16 14 12 34c-3.6 18 14 28 46 26z" fill="#F7F3EC"/>
            <path d="M62 40C76 14 104 14 108 34c3.6 18-14 28-46 26z" fill="#F7F3EC"/>
            <path d="M58 64C42 62 22 68 24 82c1.8 12.6 22 12 34-6z" fill="#E4DCFF"/>
            <path d="M62 64c16-2 36 4 34 18-1.8 12.6-22 12-34-6z" fill="#E4DCFF"/>
            <path d="M60 34c-1-8-6-12-12-14M60 34c1-8 6-12 12-14" stroke="#F7F3EC" stroke-width="5" stroke-linecap="round" fill="none"/>
            <rect x="56.4" y="32" width="7.2" height="56" rx="3.6" fill="#5B4BC4"/>
          </g>
        </svg>
      </div>
    </div>
  </header>

  <main id="scroll" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px calc(132px + env(safe-area-inset-bottom))"></main>

  <nav style="position:fixed;left:0;right:0;bottom:0;height:calc(84px + env(safe-area-inset-bottom));padding:8px 12px env(safe-area-inset-bottom);background:rgba(247,243,236,.94);backdrop-filter:blur(16px);border-top:1px solid rgba(22,19,15,.08);display:flex;align-items:flex-start;z-index:40">
    <button class="tab" data-tab="casa" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:6px;min-height:52px">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M3 10.2 11 3.4l8 6.8V19a.8.8 0 0 1-.8.8H3.8A.8.8 0 0 1 3 19v-8.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span style="font:700 10px/1 'Manrope'">Casa</span>
    </button>
    <button class="tab" data-tab="storico" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:6px;min-height:52px">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M4 6h14M4 11h14M4 16h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span style="font:700 10px/1 'Manrope'">Storico</span>
    </button>
    <div style="width:68px;flex:none"></div>
    <button class="tab" data-tab="stats" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:6px;min-height:52px">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><path d="M4 18V12M9.7 18V4M15.4 18v-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span style="font:700 10px/1 'Manrope'">Statistiche</span>
    </button>
    <button class="tab" data-tab="impostazioni" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:6px;min-height:52px">
      <svg width="21" height="21" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M11 3v2.2M11 16.8V19M3 11h2.2M16.8 11H19M5.3 5.3l1.6 1.6M15.1 15.1l1.6 1.6M16.7 5.3l-1.6 1.6M6.9 15.1l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span style="font:700 10px/1 'Manrope'">Impostazioni</span>
    </button>
  </nav>

  <button id="fab" aria-label="Aggiungi movimento" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:#5B4BC4;box-shadow:0 8px 22px rgba(91,75,196,.4);display:flex;align-items:center;justify-content:center;z-index:45">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M12 5.5v13M5.5 12h13" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

</div>

<div id="sheets"></div>
<div id="toast" style="position:fixed;left:20px;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:90;display:none"></div>

<script src="app.js"></script>
</body>
</html>
